schema: spec-driven

context: |
  Project: home-assistant-ai-digest-tool
  State: initialization-only workspace with AGENTS.md and no product source yet
  Product: public-ready Home Assistant AI digest tool
  Target: Docker-first for Home Assistant Core
  Interfaces: Home Assistant sources, AI providers, notifiers, renderers, persistence
  Constraints: clean-room rewrite, no secrets in code/docs/logs/memory, pnpm-only for JS/TS

strict_tdd: false

