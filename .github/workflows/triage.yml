name: Issue triage

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  triage:
    name: Classify and label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = (context.payload.issue.title || '').toLowerCase();
            const body = (context.payload.issue.body || '').toLowerCase();
            const text = `${title} ${body}`;
            const labels = [];
            if (/(crash|error|bug|fails|broken|regression|incorrect|exception|unexpected)/.test(text)) labels.push('bug');
            if (/(feature|request|would like|suggest|enhancement|add support|improve)/.test(text)) labels.push('enhancement');
            if (/(how do i|how to|question|help|not sure|explain)/.test(text)) labels.push('question');
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels
              });
            }