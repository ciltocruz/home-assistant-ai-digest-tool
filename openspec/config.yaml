rules:
  proposal:
    - Keep MVP scope Docker-first for Home Assistant Core.
    - Reject copying or extracting upstream code from unlicensed references.
    - Include secret-handling and rollback notes for risky changes.
  specs:
    - Use Given/When/Then scenarios.
    - Use RFC 2119 keywords.
    - Separate backend, frontend, provider, notifier, and persistence requirements.
  design:
    - Document adapter boundaries and rationale.
    - Keep provider and notifier abstractions explicit.
  tasks:
    - Group by phase and keep tasks reviewable within one session.
    - Add tests before or alongside implementation once tooling exists.
  apply:
    - Follow clean-room constraints and avoid secrets in logs or fixtures.
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Preserve archived change folders as an audit trail.
