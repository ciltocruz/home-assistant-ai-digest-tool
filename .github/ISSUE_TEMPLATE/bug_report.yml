name: Bug report
description: Report a problem with the application. Fill in every section so the issue can be reproduced.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting — a complete report is the fastest way to a fix.

        Maintainers triage new issues and add the `status:approved` label once confirmed; approved issues are what pull requests link to.
  - type: input
    id: version
    attributes:
      label: Application version
      description: Version shown in the release notes or the container image tag (for example v1.2.0).
      placeholder: "v1.2.0"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How is the application running?
      options:
        - Docker container
        - Local development
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect to happen, and what actually happened? Include exact error text where possible.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that lead to the problem.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: Paste redacted logs. Remove tokens, passwords, entity names, and other sensitive values first.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all secrets, tokens, and personal data from the information above.
          required: true
