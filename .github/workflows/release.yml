name: Release

# Releases are manual by design: merging to main only accumulates changes.
# Publish explicitly from the Actions tab (workflow_dispatch on main) or by
# pushing a `v*` tag. One run produces ONE release covering everything since
# the previous tag, with the version computed from all accumulated commits.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    outputs:
      released: ${{ steps.semantic.outputs.released || steps.tag.outputs.released }}
      version: ${{ steps.semantic.outputs.version || steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        id: semantic
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          output=$(pnpm exec semantic-release 2>&1)
          echo "$output"
          if echo "$output" | grep -q "Created tag"; then
            version=$(echo "$output" | grep -oP 'Created tag \Kv[0-9]+\.[0-9]+\.[0-9]+')
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version from pushed tag
        id: tag
        if: github.event_name == 'push'
        run: |
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  docker:
    name: Publish GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: release
    if: needs.release.outputs.released == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-preview
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ciltocruz/home-assistant-ai-digest-tool:${{ needs.release.outputs.version }}
            ghcr.io/ciltocruz/home-assistant-ai-digest-tool:latest