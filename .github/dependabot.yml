version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    ignore:
      # Deliberate migrations pending; do not ride along in grouped bumps.
      - dependency-name: "zod"
        versions: [">=4"]
      - dependency-name: "typescript"
        versions: [">=6"]
      - dependency-name: "@types/node"
        versions: [">=23"]
      - dependency-name: "jsdom"
        versions: [">=30"]
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"