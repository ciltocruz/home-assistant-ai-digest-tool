name: Bug report
description: Report something broken in the digest tool
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        Please search existing issues first to avoid duplicates. Maintainers triage new issues and add the `status:approved` label once confirmed — approved issues are what pull requests link to.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact error text where possible. Redact secrets, tokens, and credentials — reports containing secrets will be sanitized or closed.
      placeholder: A clear description of the failure, including any error message.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Trigger '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / deployment
      description: Release tag (e.g. v1.2.0) or commit, and where it runs (Docker on NAS/server, local dev).
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Container logs or report warnings. Redact tokens and personal data.
      render: shell
    validations:
      required: false
