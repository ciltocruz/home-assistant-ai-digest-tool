# CodeRabbit configuration.
#
# CodeRabbit is free forever for public repositories. No secrets or workflow
# tokens are required: reviews run through the CodeRabbit GitHub App, which a
# maintainer installs once on the repository
# (https://github.com/apps/coderabbitai). This file only tunes its behavior.
# Private-repo pricing starts at $24/developer/month; this public repo pays $0.
language: "en-US"

tone_instructions: >
  Be concise and direct. Comment only on issues that matter (bugs, security,
  correctness, meaningful simplifications). Skip style nits already covered by
  ESLint/Prettier and the existing CI.

reviews:
  profile: "chill"
  auto_review:
    enabled: true
  high_level_summary:
    enabled: true
  collapse_walkthrough:
    enabled: true
  path_instructions:
    - path: "pnpm-lock.yaml"
      instructions: "Do not review lockfile changes; they are generated by Dependabot."
    - path: "coverage/**"
      instructions: "Do not review generated coverage output."
